name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check
        run: |
          for f in *.sh; do
            bash -n "$f"
          done

      - name: shellcheck
        run: shellcheck --severity=warning *.sh
